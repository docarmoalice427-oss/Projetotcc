
services:
  db:
    image: mysql:8.0
    container_name: mysql_almoxarifado
    restart: always

    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: "172909"
      MYSQL_DATABASE: "almoxarifado"

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p172909", "-e", "SELECT 1 FROM almoxarifado.usuarios LIMIT 1;"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: .
    container_name: flask_almoxarifado
    restart: always

    ports:
      - "5000:5000"

    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
