<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Controle de Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estoque.css') }}">
</head>

<body>
   <nav class="navbar">
        <ul>
        <li><a href="/home">Home</a></li>
        </ul>
    </nav>

     <div class="container">
        <h1>Controle de Almoxarifado</h1>

 <div class="formulario">
            <input type="text" id="nomeProduto" placeholder="Nome do produto">
            <input type="number" id="quantidadeProduto" placeholder="Quantidade">
            <input type="text" id="linkFoto" placeholder="Link da foto do produto">
            <button onclick="adicionarProduto()">Adicionar Produto</button>
 </div>

    <table>
        <thead>
             <tr>
              <th>ID</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Imagem</th>
                <th>Ações</th>
             </tr>
            </thead>

        <tbody id="tabelaProdutos">
             <!-- Os produtos cadastrados aparecerão aqui via JavaScript -->
        </tbody>
        </table>
</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
 </body>

</html>
