version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_almoxarifado
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 172909
      MYSQL_DATABASE: almoxarifado
    ports:
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: flask_almoxarifado
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    depends_on:
      - db

volumes:
  mysql_data: